[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainguard"
version = "1.0.0"
description = "Leakage-audited brain tumour classification from T1 MRI with patient-level validation, hypothesis tests, robustness and SHAP"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Muneera Mohamed" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pillow>=10",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dl = ["tensorflow>=2.16", "keras>=3.0", "h5py>=3.9", "shap>=0.46"]
dev = ["pytest>=8", "ruff>=0.5", "pytest-github-actions-annotate-failures>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
